apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
data:
  DB_HOST: postgres-orderservice
  DB_PORT: "5435"
  DB_NAME: "innowise_db"
  SERVER_PORT: "8082"
  AUTH_SERVICE_VALIDATE_URL: http://auth-service:8080/api/v1/auth/validate
  USER_SERVICE_URL: http://user-service:8081/api/v1
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_CONSUMER_GROUP_ID: order-service-group
  KAFKA_TOPIC_CREATE_ORDER: order-created-topic
  KAFKA_TOPIC_CREATE_PAYMENT: payment-created-topic