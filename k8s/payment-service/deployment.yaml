apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      priorityClassName: medium-priority
      containers:
        - name: payment-service
          image: payment-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: MONGO_PORT
            - name: MONGO_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: MONGO_DB_NAME
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: SPRING_KAFKA_CONSUMER_GROUP_ID
            - name: KAFKA_TOPIC_CREATE_ORDER
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: KAFKA_TOPIC_CREATE_ORDER
            - name: KAFKA_TOPIC_CREATE_PAYMENT
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: KAFKA_TOPIC_CREATE_PAYMENT
            - name: MONGO_URI
              value: "mongodb://$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DB_NAME)"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DB_NAME)"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
