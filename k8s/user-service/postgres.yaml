apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-userservice
  template:
    metadata:
      labels:
        app: postgres-userservice
    spec:
      priorityClassName: high-priority
      containers:
        - name: postgres
          image: 'postgres:15'
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "innowise_user_service"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: DB_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-user-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-userservice
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-userservice
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-user-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi